# Broadzen local stack (infra/PLAN.md section 4).
#   cd infra && docker compose up -d --build        # start everything
#   docker compose --profile dev up -d adminer      # optional DB browser on http://127.0.0.1:8081
# Secrets live in infra/.env (copy .env.example). Never commit infra/.env.
name: broadzen

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: broadzen
      POSTGRES_USER: broadzen_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD in infra/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Only on localhost, for local DB tools (host already uses 5432).
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broadzen_owner -d broadzen"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: .., target: migrate }
    environment:
      MIGRATE_DATABASE_URL: postgres://broadzen_owner:${OWNER_DB_PASSWORD}@postgres:5432/broadzen
      APP_DATABASE_URL: postgres://broadzen_app:${APP_DB_PASSWORD}@postgres:5432/broadzen
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in infra/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    build:
      context: ..
      target: runner
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    # Existing integrations (Meta, WhatsApp, Firebase push) keep their keys in the
    # repo-root .env.local until step B5 moves them per workspace.
    env_file:
      - path: ../.env.local
        required: false
    environment:
      DATABASE_URL: postgres://broadzen_app:${APP_DB_PASSWORD}@postgres:5432/broadzen
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in infra/.env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["3000"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app]

  adminer:
    image: adminer:4
    profiles: [dev]
    ports: ["127.0.0.1:8081:8080"]
    depends_on: [postgres]

volumes:
  pgdata:
