# Reverse proxy in front of the Next.js app (infra/PLAN.md §4).
# Local: plain HTTP on :80. Production: add the TLS server block at the bottom.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  client_max_body_size 20m;           # contact imports / template media uploads

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # Brute-force protection for credential endpoints: 10 req/min per IP, small burst.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  # Session upkeep (/me, /refresh, /logout) runs on every page load: generous limit.
  limit_req_zone $binary_remote_addr zone=session:10m rate=120r/m;
  # Public enquiry form: 5 req/min per IP.
  limit_req_zone $binary_remote_addr zone=enquiry:10m rate=5r/m;
  limit_req_status 429;

  upstream app { server app:3000; keepalive 16; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/auth/(login|signup|google|change-password)$ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://app;
    }
    location /api/auth/ {
      limit_req zone=session burst=30 nodelay;
      proxy_pass http://app;
    }
    location = /api/enquiries {
      limit_req zone=enquiry burst=3 nodelay;
      proxy_pass http://app;
    }
    location /_next/static/ {
      proxy_pass http://app;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
    location / {
      proxy_pass http://app;
    }
  }

  # Production (VPS): terminate TLS here, e.g. with certbot-managed certs, and
  # redirect :80 → :443. Also set COOKIE_SECURE=true in infra/.env.
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name app.example.com;
  #   ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   ... same locations as above ...
  # }
}
